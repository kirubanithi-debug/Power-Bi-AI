services:
  - type: web
    name: ai-powerbi-assistant-backend
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
